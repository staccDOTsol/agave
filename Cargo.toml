[workspace]
resolver = "2"
members = [
    "matcher",
    "genesis",
    "programs/lazy-claim",
    "programs/bridge",
    "programs/secret-pump",
    "programs/validator-subsidy",
    "tools/snapshot-fork",
    "tools/genesis-emit",
    "tools/claim-cli",
    "tools/bridge-cli",
    "tools/federation-attestor",
    "integration-tests",
    "e2e-tests",
]
# Planned crates (uncomment as they land):
#   "programs/secret-ray",          # forked Raydium AMM v4 / CLMM / CPMM + router
#   "programs/secret-stake",
#   "programs/secret-payroll",

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["stacc"]

[workspace.dependencies]
solana-program = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Dep-graph note (resolved as of Phase 5.5):
# `programs/bridge`, `programs/secret-pump`, and `programs/validator-subsidy` are on
# `anchor-lang = "1"` / `anchor-spl = "1"`, which use `solana-program 2.x` natively
# (via the split `spl-token-2022-interface` crate). Workspace-wide `cargo check` now
# resolves a single coherent solana-program / spl-token-2022 lockfile entry and builds
# every crate in one invocation.

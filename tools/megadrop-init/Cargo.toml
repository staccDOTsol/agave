[package]
name = "staccana-megadrop-init"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "One-shot init for the Staccana megadrop's MegadropConfig PDA. Run after step 40 deploys the megadrop program."

[[bin]]
name = "staccana-megadrop-init"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
solana-client = "2"
solana-sdk = "2"
solana-program = { workspace = true }
sha2 = "0.10"
borsh = { version = "1", features = ["derive"] }
hex = "0.4"
